version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: assistant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assistant-network

  redis:
    image: redis:7-alpine
    container_name: assistant_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - assistant-network

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: assistant_ai_service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_assistant}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SHARED_STORAGE_PATH: /shared/storage
    volumes:
      - shared_storage:/shared/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - assistant-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: assistant_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowledge_assistant}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: http://ai-service:8001
      APP_JWT_SECRET: ${APP_JWT_SECRET:-9a78bf234c90de45f871234098bc1234567890abcdef1234567890abcdef}
      SHARED_STORAGE_PATH: /shared/storage
    volumes:
      - shared_storage:/shared/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - assistant-network

volumes:
  pgdata:
  redisdata:
  shared_storage:

networks:
  assistant-network:
    driver: bridge
